name: Feature request
description: Suggest something Smart Paste could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or the kind of form, and where Smart Paste gets in the way or could help more.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like Smart Paste to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
    validations:
      required: false
