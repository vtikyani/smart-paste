name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: this workflow only builds and tests.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: pwsh

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SmartPaste.slnx

      - name: Build
        run: dotnet build SmartPaste.slnx --configuration Release --no-restore

      - name: Test Core
        run: >
          dotnet test tests/SmartPaste.Core.Tests --configuration Release --no-build
          --logger "trx;LogFileName=core.trx" --results-directory TestResults

      - name: Test App
        run: >
          dotnet test tests/SmartPaste.App.Tests --configuration Release --no-build
          --logger "trx;LogFileName=app.trx" --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
